services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quality_inspection
      POSTGRES_USER: quality
      POSTGRES_PASSWORD: quality
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quality -d quality_inspection"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://quality:quality@db:5432/quality_inspection
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
volumes:
  postgres_data:
  uploads_data:
  frontend_node_modules:
